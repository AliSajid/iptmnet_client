[package]
name = "iptmnet"
version = "1.8.0"
edition = "2024"
rust-version = "1.86.0"
description = "A convenient CLI for the IPTMNet API"
readme = "README.md"
repository = "https://github.com/AliSajid/iptmnet_client"
license = "GPL-3.0-or-later"
authors = ["Ali Sajid Imami <Ali.Sajid.Imami@gmail.com>"]
categories = [
    "command-line-utilities",
    "science",
    "web-programming::http-client",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "iptmlib"
path = "src/iptmlib/lib.rs"
crate-type = ["lib"]

[[bin]]
name = "iptmnet"
path = "src/iptmnet/main.rs"

[profile.dev]
opt-level = 1
debug = true

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1


[dependencies]
anyhow = { version = "1.0.86", features = ["backtrace"] }
clap = { version = "4.5.16", features = [
    "derive",
    "string",
    "unicode",
    "wrap_help",
] }
reqwest = { version = "0.12.7", features = ["json"] }
serde = { version = "1.0.209", features = ["derive", "serde_derive"] }
serde-aux = "4.5.0"
serde_json = "1.0.127"
tokio = { version = "1.40.0", features = ["full"] }

[dev-dependencies]
rstest = "0.22.0"
